name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # required to create the GitHub Release
  id-token: write # required for trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0; Node 24
      # ships npm 11.19+. No dependency cache: release builds resolve fresh.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      # The release gate: no notes, no publish. Fails when CHANGELOG.md has no
      # section for this version, or the section has no entries under it.
      # `npm run release <version>` writes both the section and the version bump,
      # so reaching here without notes means the manifest was edited by hand.
      - name: Verify CHANGELOG has notes for this version
        run: node scripts/changelog.mjs extract "${GITHUB_REF_NAME#v}" > /dev/null

      # 0.2.0 was published by hand before trusted publishing was configured,
      # so tagging it retroactively must not fail the run.
      - name: Check whether this version is already published
        id: check
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          PKG_VERSION=$(node -p "require('./package.json').version")
          if npm view "$PKG_NAME@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "::notice::$PKG_NAME@$PKG_VERSION is already on the registry; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm run lint
      - run: npm run format:check
      - run: npm run build
      - run: npm test

      # No NODE_AUTH_TOKEN: OIDC supplies short-lived credentials, and npm
      # generates the provenance attestation automatically.
      - name: Publish to npm
        if: steps.check.outputs.skip == 'false'
        run: npm publish --access public

      # The changelog section *is* the release body, so what GitHub shows and what
      # the repo records can never drift. Runs even when the publish was skipped,
      # so a retroactively tagged version still gets its release page.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::notice::Release $GITHUB_REF_NAME already exists; leaving it untouched."
            exit 0
          fi
          node scripts/changelog.mjs extract "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
